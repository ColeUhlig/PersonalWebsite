name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'infra/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'scripts/deploy.sh'
              - '.github/workflows/deploy.yml'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          if [[ "${{ steps.changes.outputs.infra }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scripts/deploy.sh
          else
            scripts/deploy.sh --content-only
          fi
